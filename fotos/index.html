<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Banco de Fotos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Manrope:wght@600;800&display=swap">
<style>
/* Layout: uma coluna de busca no topo, grade de fotos 2 colunas no celular, visualizador em tela cheia ao tocar */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --ink:#1d2228; --muted:#5d6670; --line:#dde1e5;
  --accent:#2f4858; --zap:#1f8a4c; --zap-ink:#ffffff; --chip:#e9edf0;
  --display:"Manrope",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181c; --surface:#1d2328; --ink:#eef1f3; --muted:#a3acb5; --line:#2e363d;
  --accent:#9fc3d6; --zap:#25a35c; --zap-ink:#ffffff; --chip:#262e35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c; --surface:#1d2328; --ink:#eef1f3; --muted:#a3acb5; --line:#2e363d;
  --accent:#9fc3d6; --zap:#25a35c; --zap-ink:#ffffff; --chip:#262e35; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 18px}
.search{display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
label.lbl{font-weight:700;font-size:1rem}
.field{display:flex;gap:8px}
#busca{flex:1;min-width:0;font:inherit;font-size:1.25rem;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
#busca:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
#limpar{font:inherit;font-weight:700;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:700;font-size:1.05rem;padding:10px 18px;border-radius:999px;border:2px solid transparent;background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.count{color:var(--muted);font-size:1rem;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--chip)}
.card .cap{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.code{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.cor{color:var(--muted);font-size:.95rem}
.card:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vazio{padding:32px 8px;color:var(--muted);font-size:1.1rem}
/* visualizador */
.viewer{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vin{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;display:flex;flex-direction:column;gap:14px}
.voltar{align-self:flex-start;font:inherit;font-weight:700;font-size:1.1rem;padding:12px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.vimg{width:100%;border-radius:14px;display:block;background:var(--chip)}
.vcode{font-family:var(--display);font-weight:800;font-size:1.6rem}
.btn{font:inherit;font-weight:700;font-size:1.2rem;padding:18px;border-radius:14px;border:0;width:100%;cursor:pointer}
.btn.zap{background:var(--zap);color:var(--zap-ink)}
.btn.save{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.aviso{background:var(--chip);border-radius:12px;padding:14px 16px;font-size:1.05rem}
.dica{color:var(--muted);font-size:1rem}
.mais{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mais button{padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:none;cursor:pointer}
.mais button[aria-current="true"]{border-color:var(--accent)}
.mais img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .12s}.card:active{transform:scale(.98)}}
</style>

</head><body>
<div class="wrap">
  <h1>Banco de Fotos</h1>
  <p class="sub">Fotos com modelo, prontas para divulgar no WhatsApp e nas redes.</p>

  <div class="search">
    <label class="lbl" for="busca">Procure pelo código da peça</label>
    <div class="field">
      <input id="busca" type="search" inputmode="numeric" placeholder="Exemplo: 1503" autocomplete="off">
      <button id="limpar" type="button" hidden>Limpar</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Tipo de peça"></div>
  </div>

  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vcode">
  <div class="vin">
    <button class="voltar" id="voltar" type="button">← Voltar</button>
    <img class="vimg" id="vimg" alt="">
    <div><div class="vcode" id="vcode"></div><div class="cor" id="vcor"></div></div>
    <button class="btn zap" id="bzap" type="button">Enviar no WhatsApp</button>
    <button class="btn save" id="bsave" type="button">Salvar no celular</button>
    <div class="aviso" id="aviso" hidden></div>
    <p class="dica">Dica: você também pode segurar o dedo em cima da foto para salvar ou compartilhar.</p>
    <div id="maisbox" hidden><p class="lbl">Outras fotos deste modelo</p><div class="mais" id="mais"></div></div>
  </div>
</div>

<script>
const FOTOS=[{"id": "ANK1016-1", "c": ["ANK 1016"], "cor": "", "cat": "Anéis"}, {"id": "ANK1072-1", "c": ["ANK 1072"], "cor": "", "cat": "Anéis"}, {"id": "ANK1091-1", "c": ["ANK 1091"], "cor": "", "cat": "Anéis"}, {"id": "ANK1155-1", "c": ["ANK 1155"], "cor": "", "cat": "Anéis"}, {"id": "ANK1164-1", "c": ["ANK 1164"], "cor": "", "cat": "Anéis"}, {"id": "ANK1165-1", "c": ["ANK 1165"], "cor": "", "cat": "Anéis"}, {"id": "ANK1182-1", "c": ["ANK 1182"], "cor": "", "cat": "Anéis"}, {"id": "ANK1208-1", "c": ["ANK 1208"], "cor": "", "cat": "Anéis"}, {"id": "ANK1209-1", "c": ["ANK 1209"], "cor": "", "cat": "Anéis"}, {"id": "ANK1241-1", "c": ["ANK 1241"], "cor": "", "cat": "Anéis"}, {"id": "ANK1279-ANK1302-1", "c": ["ANK 1279", "ANK 1302"], "cor": "", "cat": "Anéis"}, {"id": "ANK1280-1", "c": ["ANK 1280"], "cor": "", "cat": "Anéis"}, {"id": "ANK1284-1", "c": ["ANK 1284"], "cor": "", "cat": "Anéis"}, {"id": "ANK1291-1", "c": ["ANK 1291"], "cor": "", "cat": "Anéis"}, {"id": "ANK1303-1", "c": ["ANK 1303"], "cor": "", "cat": "Anéis"}, {"id": "ANK1305-1", "c": ["ANK 1305"], "cor": "", "cat": "Anéis"}, {"id": "ANK1327-ANK1331-1", "c": ["ANK 1327", "ANK 1331"], "cor": "", "cat": "Anéis"}, {"id": "ANK1360-1", "c": ["ANK 1360"], "cor": "", "cat": "Anéis"}, {"id": "ANK1361-1", "c": ["ANK 1361"], "cor": "", "cat": "Anéis"}, {"id": "ANK1368-1", "c": ["ANK 1368"], "cor": "", "cat": "Anéis"}, {"id": "ANK1374-1", "c": ["ANK 1374"], "cor": "", "cat": "Anéis"}, {"id": "ANK1376-1", "c": ["ANK 1376"], "cor": "", "cat": "Anéis"}, {"id": "ANK1377-1", "c": ["ANK 1377"], "cor": "", "cat": "Anéis"}, {"id": "ANK1380-1", "c": ["ANK 1380"], "cor": "", "cat": "Anéis"}, {"id": "ANK1389-amarela-1", "c": ["ANK 1389"], "cor": "Amarela", "cat": "Anéis"}, {"id": "ANK1389-azul-1", "c": ["ANK 1389"], "cor": "Azul", "cat": "Anéis"}, {"id": "ANK1391-1", "c": ["ANK 1391"], "cor": "", "cat": "Anéis"}, {"id": "ANK1425-1", "c": ["ANK 1425"], "cor": "", "cat": "Anéis"}, {"id": "ANK1428-1", "c": ["ANK 1428"], "cor": "", "cat": "Anéis"}, {"id": "ANK1430-1", "c": ["ANK 1430"], "cor": "", "cat": "Anéis"}, {"id": "ANK1431-1", "c": ["ANK 1431"], "cor": "", "cat": "Anéis"}, {"id": "ANK1440-1", "c": ["ANK 1440"], "cor": "", "cat": "Anéis"}, {"id": "ANK1445-1", "c": ["ANK 1445"], "cor": "", "cat": "Anéis"}, {"id": "ANK1452-1", "c": ["ANK 1452"], "cor": "", "cat": "Anéis"}, {"id": "ANK1452-2", "c": ["ANK 1452"], "cor": "", "cat": "Anéis"}, {"id": "ANK1453-1", "c": ["ANK 1453"], "cor": "", "cat": "Anéis"}, {"id": "ANK1454-1", "c": ["ANK 1454"], "cor": "", "cat": "Anéis"}, {"id": "ANK1455-1", "c": ["ANK 1455"], "cor": "", "cat": "Anéis"}, {"id": "ANK1457-1", "c": ["ANK 1457"], "cor": "", "cat": "Anéis"}, {"id": "ANK1458-1", "c": ["ANK 1458"], "cor": "", "cat": "Anéis"}, {"id": "ANK1459-1", "c": ["ANK 1459"], "cor": "", "cat": "Anéis"}, {"id": "ANK1461-1", "c": ["ANK 1461"], "cor": "", "cat": "Anéis"}, {"id": "ANK1463-1", "c": ["ANK 1463"], "cor": "", "cat": "Anéis"}, {"id": "ANK1465-1", "c": ["ANK 1465"], "cor": "", "cat": "Anéis"}, {"id": "ANK1466-1", "c": ["ANK 1466"], "cor": "", "cat": "Anéis"}, {"id": "ANK1467-1", "c": ["ANK 1467"], "cor": "", "cat": "Anéis"}, {"id": "ANK1476-1", "c": ["ANK 1476"], "cor": "", "cat": "Anéis"}, {"id": "ANK1482-1", "c": ["ANK 1482"], "cor": "", "cat": "Anéis"}, {"id": "ANK1489-1", "c": ["ANK 1489"], "cor": "", "cat": "Anéis"}, {"id": "ANK1491-1", "c": ["ANK 1491"], "cor": "", "cat": "Anéis"}, {"id": "ANK1492-1", "c": ["ANK 1492"], "cor": "", "cat": "Anéis"}, {"id": "ANK1495-1", "c": ["ANK 1495"], "cor": "", "cat": "Anéis"}, {"id": "ANK1500-1", "c": ["ANK 1500"], "cor": "", "cat": "Anéis"}, {"id": "ANK1502-1", "c": ["ANK 1502"], "cor": "", "cat": "Anéis"}, {"id": "ANK1503-azul-1", "c": ["ANK 1503"], "cor": "Azul", "cat": "Anéis"}, {"id": "ANK1503-azul-2", "c": ["ANK 1503"], "cor": "Azul", "cat": "Anéis"}, {"id": "ANK1503-1", "c": ["ANK 1503"], "cor": "", "cat": "Anéis"}, {"id": "ANK1505-1", "c": ["ANK 1505"], "cor": "", "cat": "Anéis"}, {"id": "ANK1507-1", "c": ["ANK 1507"], "cor": "", "cat": "Anéis"}, {"id": "ANK1535-1", "c": ["ANK 1535"], "cor": "", "cat": "Anéis"}, {"id": "ANK1538-1", "c": ["ANK 1538"], "cor": "", "cat": "Anéis"}, {"id": "ANK1541-1", "c": ["ANK 1541"], "cor": "", "cat": "Anéis"}, {"id": "ANK1543-1", "c": ["ANK 1543"], "cor": "", "cat": "Anéis"}, {"id": "ANK1544-1", "c": ["ANK 1544"], "cor": "", "cat": "Anéis"}, {"id": "ANK1545-1", "c": ["ANK 1545"], "cor": "", "cat": "Anéis"}, {"id": "ANK1546-1", "c": ["ANK 1546"], "cor": "", "cat": "Anéis"}, {"id": "ANK1547-ANK1548-ANK1209-1", "c": ["ANK 1547", "ANK 1548", "ANK 1209"], "cor": "", "cat": "Anéis"}, {"id": "ANK578-1", "c": ["ANK 578"], "cor": "", "cat": "Anéis"}, {"id": "ANK645-1", "c": ["ANK 645"], "cor": "", "cat": "Anéis"}, {"id": "ANK686-1", "c": ["ANK 686"], "cor": "", "cat": "Anéis"}, {"id": "ANK750-1", "c": ["ANK 750"], "cor": "", "cat": "Anéis"}, {"id": "ANK773-1", "c": ["ANK 773"], "cor": "", "cat": "Anéis"}, {"id": "ANK909-1", "c": ["ANK 909"], "cor": "", "cat": "Anéis"}, {"id": "SOLITARIOS-1", "c": ["Solitários"], "cor": "", "cat": "Anéis"}, {"id": "ANK1387-1", "c": ["ANK 1387"], "cor": "", "cat": "Anéis"}, {"id": "ANK1423-1", "c": ["ANK 1423"], "cor": "", "cat": "Anéis"}, {"id": "ANK1424-1", "c": ["ANK 1424"], "cor": "", "cat": "Anéis"}, {"id": "ANK1498-1", "c": ["ANK 1498"], "cor": "", "cat": "Anéis"}, {"id": "ANK1503-rosa-1", "c": ["ANK 1503"], "cor": "Rosa", "cat": "Anéis"}, {"id": "ANK1537-1", "c": ["ANK 1537"], "cor": "", "cat": "Anéis"}, {"id": "ANK1546-2", "c": ["ANK 1546"], "cor": "", "cat": "Anéis"}, {"id": "ANK1547-1", "c": ["ANK 1547"], "cor": "", "cat": "Anéis"}, {"id": "ANK459-1", "c": ["ANK 459"], "cor": "", "cat": "Anéis"}, {"id": "ANK713-1", "c": ["ANK 713"], "cor": "", "cat": "Anéis"}, {"id": "ANK895-amarela-1", "c": ["ANK 895"], "cor": "Amarela", "cat": "Anéis"}, {"id": "BLK055-1", "c": ["BLK 055"], "cor": "", "cat": "Pulseiras"}];
const CATS=["Todos",...new Set(FOTOS.map(f=>f.cat))];
let cat="Todos",q="",atual=null;
const $=id=>document.getElementById(id);
const nome=f=>f.c.join(" + ");
const arquivo=f=>f.id+".jpg";

function chips(){
  $("chips").innerHTML="";
  CATS.forEach(c=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=c;
    b.setAttribute("aria-pressed",c===cat);b.onclick=()=>{cat=c;chips();render()};$("chips").append(b)});
}
function lista(){
  const d=q.replace(/\D/g,"");
  return FOTOS.filter(f=>(cat==="Todos"||f.cat===cat)&&(!d||f.c.some(c=>c.replace(/\D/g,"").includes(d))));
}
function render(){
  const l=lista(),g=$("grid");g.innerHTML="";
  $("limpar").hidden=!q;
  $("count").textContent=l.length===1?"1 foto":l.length+" fotos";
  if(!l.length){g.innerHTML='<div class="vazio">Nenhuma foto com esse código ainda. Confira o número ou peça a foto para a Kau.</div>';return}
  l.forEach(f=>{
    const b=document.createElement("button");b.className="card";b.type="button";
    b.innerHTML='<img loading="lazy" alt=""><div class="cap"><span class="code"></span><span class="cor"></span></div>';
    b.querySelector("img").src="t/"+arquivo(f);b.querySelector("img").alt="Foto da peça "+nome(f);
    b.querySelector(".code").textContent=nome(f);b.querySelector(".cor").textContent=f.cor?("Pedra "+f.cor.toLowerCase()):"";
    b.onclick=()=>abrir(f);g.append(b);
  });
}
function abrir(f){
  atual=f;$("aviso").hidden=true;
  $("vimg").src="f/"+arquivo(f);$("vimg").alt="Foto da peça "+nome(f);
  $("vcode").textContent=nome(f);$("vcor").textContent=f.cor?("Pedra "+f.cor.toLowerCase()):"";
  const irmas=FOTOS.filter(x=>x!==f&&x.c.some(c=>f.c.includes(c)));
  $("maisbox").hidden=!irmas.length;$("mais").innerHTML="";
  irmas.forEach(x=>{const b=document.createElement("button");b.type="button";b.innerHTML='<img alt="">';
    b.querySelector("img").src="t/"+arquivo(x);b.querySelector("img").alt="Foto "+nome(x);b.onclick=()=>abrir(x);$("mais").append(b)});
  $("viewer").hidden=false;$("viewer").scrollTop=0;document.body.style.overflow="hidden";$("voltar").focus();
}
function fechar(){$("viewer").hidden=true;document.body.style.overflow="";atual=null}
function aviso(t){$("aviso").textContent=t;$("aviso").hidden=false}
async function blob(f){const r=await fetch("f/"+arquivo(f));return await r.blob()}
const iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
async function compartilhar(f){
  const file=new File([await blob(f)],arquivo(f),{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}
  return false;
}
function baixar(f){const a=document.createElement("a");a.href="f/"+arquivo(f);a.download=arquivo(f);document.body.append(a);a.click();a.remove()}
$("bzap").onclick=async()=>{
  const f=atual;if(!f)return;
  try{if(await compartilhar(f))return}catch(e){if(e&&e.name==="AbortError")return}
  baixar(f);aviso("Foto salva. Agora abra o WhatsApp, toque no clipe 📎 e escolha a foto na galeria.");
};
$("bsave").onclick=async()=>{
  const f=atual;if(!f)return;
  if(iOS){try{if(await compartilhar(f)){aviso("Na tela que abriu, toque em “Salvar Imagem”.");return}}catch(e){if(e&&e.name==="AbortError"){aviso("Para salvar, toque em “Salvar Imagem” na tela de compartilhar.");return}}}
  baixar(f);aviso("Foto salva no seu celular.");
};
$("voltar").onclick=fechar;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("viewer").hidden)fechar()});
$("busca").addEventListener("input",e=>{q=e.target.value;render()});
$("limpar").onclick=()=>{q="";$("busca").value="";render();$("busca").focus()};
chips();render();
</script>

</body></html>
